      - OperationOutcome/grouped-fhir-job-failure
  staged-async-examples:
    name: "Staged Asynchronous Patient Job Examples"
    resources:
      - Library/staged-patient
      - Task/staged-async-job
      - Library/staged-async-preliminary-plan
      - Task/staged-async-preliminary-task
      - Parameters/staged-async-preliminary-result
      - Library/staged-async-advanced-plan
      - Task/staged-async-advanced-task
      - Parameters/staged-async-advanced-result
      - Bundle/staged-r4-patient-result
      - Parameters/staged-async-job-result
  examples-reversible-pathology:
    name: "Reversible Clinical Pathology Order Examples"
    resources:
      - DocumentReference/pathology-supplied-lookup
      - DocumentReference/pathology-task-lookup
  examples-standalone-export:
    name: "Standalone Clinical Export Examples"
    resources:
      - Bundle/standalone-export-input
      - Bundle/standalone-export-output
      - Library/standalone-export-policy
      - Provenance/standalone-export-evidence
  draft-native-payload-indexes:
    name: "Draft DICOM and CDA Index Profiles and Examples"
    description: "Proposed binding artifacts for review. Conformance to this supplement uses DIS-FHIR-Payload."
    resources:
      - StructureDefinition/DIS-DICOMStudyIndex
      - StructureDefinition/DIS-CDADocumentIndex
      - ImagingStudy/study-42
