# sushi-config.yaml is documented https://fshschool.org/docs/sushi/configuration/
# ───────────────────────────────────────────────────
# the id should be lowercase made up of "ihe." + {domain acronym} + "." + {profile acronym/short-name}
# e.g. ihe.iti.mhds, or ihe.iti.basicaudit
id: ihe.iti.dis
canonical: https://profiles.ihe.net/ITI/DIS
version: 0.0.1-current
name: IHE_ITI_DIS
title: "De-Identification Services (DIS) Profile"
description: DIS (De-Identification Services) is an IHE interoperability profile that standardizes the workflow for policy-governed de-identification of HL7 FHIR health data through four actors (De-ID Manager, De-Identifier, Requester, Integrated De-ID Manager/De-Identifier) and four transactions, supporting both synchronous and asynchronous job patterns with auditable provenance evidence.
releaseLabel: ci-build
#releaseLabel: ballot
#releaseLabel: trial-use
#releaseLabel: release
#date: 2022-01-02
status: draft
publisher:
  ## Find your domain contact on the https://www.ihe.net/ihe_domains page
  - name: IHE IT Infrastructure Technical Committee
  - url: https://www.ihe.net/ihe_domains/it_infrastructure/
  - email: iti@ihe.net
contact:
  - name: IHE IT Infrastructure Technical Committee
    telecom:
      - system: email
        value: iti@ihe.net
license:  CC-BY-4.0
fhirVersion: 4.0.1
jurisdiction: 'http://unstats.un.org/unsd/methods/m49/m49.htm#001'
#copyright: IHE http://www.ihe.net/Governance/#Intellectual_Property
copyrightYear: 2021+
dependencies:
  ihe.iti.balp:
    id: iheitibasicaudit
    uri: https://profiles.ihe.net/ITI/BALP/ImplementationGuide/ihe.iti.balp
    version: 1.1.x


instanceOptions:
  # Assign inline resource IDs explicitly where the examples carry them.
  setId: standalone-only

parameters:  # see https://confluence.hl7.org/display/FHIR/Implementation+Guide+Parameters
  path-resource:
    - input/resources
    - fsh-generated/resources
#  path-pages:
#    - input/pagecontent
#    - fsh-generated/includes
  show-inherited-invariants: 'false'
  usage-stats-opt-out: 'false'
  logging: progress
  shownav: 'true'
  active-tables: 'false'
  apply-contact: 'true'
  apply-jurisdiction: 'true'
  apply-publisher: 'true'
  apply-version: 'true'
# valueSets and codeSystems should be given OIDs, this is especially required if that codeSystem or valueSet is going to be used by CDA. IHE has an OID root that is managed https://wiki.ihe.net/index.php/OID_Registration, with a branch assigned to each IHE domain. Each IHE domain should have a page where they manage assignments within their branch. an OID should be assigned to each IG, and that OID placed below so that the IG publisher will manage OID assignment to all valueSets and codeSystems defined in that IG. The IG publisher will create an ./oids.ini in the project root that will need to be checked into your github repository.
#  auto-oid-root: 1.3.6.1.4.1.19376.1.5....

resources:
  Task/uc1-bulk-cohort-job:
    exampleCanonical: https://profiles.ihe.net/ITI/DIS/StructureDefinition/DIS-DeIdentificationJob
  Task/uc4-cloud-decision-support-job:
    exampleCanonical: https://profiles.ihe.net/ITI/DIS/StructureDefinition/DIS-DeIdentificationJob
  Task/grouped-fhir-job-request:
    exampleCanonical: https://profiles.ihe.net/ITI/DIS/StructureDefinition/DIS-DeIdentificationJob
  Task/grouped-fhir-task-patient-r4:
    exampleCanonical: https://profiles.ihe.net/ITI/DIS/StructureDefinition/DIS-DeIdentificationTask
  Task/grouped-fhir-task-imaging-report-r5:
    exampleCanonical: https://profiles.ihe.net/ITI/DIS/StructureDefinition/DIS-DeIdentificationTask
  Task/staged-async-job:
    exampleCanonical: https://profiles.ihe.net/ITI/DIS/StructureDefinition/DIS-DeIdentificationJob
  Task/staged-async-preliminary-task:
    exampleCanonical: https://profiles.ihe.net/ITI/DIS/StructureDefinition/DIS-DeIdentificationTask
  Task/staged-async-advanced-task:
    exampleCanonical: https://profiles.ihe.net/ITI/DIS/StructureDefinition/DIS-DeIdentificationTask
  Library/staged-patient:
    description: "Approved syntax policy that gives the Requester the expected stage and ruleSet sequence for the staged R4 Patient example."
  Bundle/staged-r4-patient-result:
    description: "Final R4 Patient with task Provenance and Manager evidence for two validated stages."
  Bundle/bulk-r4-result:
    description: "R4 result Bundle containing a bulk JSON manifest, two NDJSON file descriptors, worker Provenance, and staged release Provenance."
  Parameters/bulk-r4-result:
    description: "Successful ITI-x4 response carrying the two-file cohort result package."
  Bundle/grouped-fhir-r4-hosted-result:
    description: "R4 result Bundle with a manifest List and Provenance for a hosted de-identified Patient and hemoglobin Observation."
  Bundle/mixed-r4-result:
    description: "R4 result Bundle with a manifest List and Provenance covering a bundled Patient and a hosted Observation."
  Parameters/mixed-r4-result:
    description: "Successful result response carrying the mixed R4 result package inline."

groups:
  grouped-fhir-job-examples:
    name: "Examples for a Job with R4 and R5 Payload Sets"
    description: "Informative artifacts for a FHIR-only job."
    resources:
      - Bundle/grouped-fhir-hosted-artifacts
      - Bundle/grouped-fhir-r5-output
      - Task/grouped-fhir-job-request
      - Task/grouped-fhir-task-patient-r4
